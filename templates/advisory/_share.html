<section class="kp-sec kp-share kp-rv" id="share">
  <h2 style="justify-content:center">বন্ধু ও পরিবারের সঙ্গে শেয়ার করুন</h2>
  <p>একজন চাষি ভাইয়ের কাজে লাগতে পারে — এখনই পাঠিয়ে দিন।</p>
  <div class="kp-cta">
    <a class="kp-btn wa" href="{{ wa_link }}" target="_blank" rel="noopener"><svg class="ic"><use href="#i-chat"/></svg>WhatsApp</a>
    <a class="kp-btn fb" href="{{ fb_link }}" target="_blank" rel="noopener"><b class="kp-fbi">f</b>Facebook</a>
    <button type="button" class="kp-btn line" data-copy="{{ share_url }}">🔗 লিংক কপি</button>
    <button type="button" class="kp-btn line" data-share data-title="{{ share_title }}" data-text="{{ share_text }}" data-url="{{ share_url }}" hidden>📤 অন্য অ্যাপে</button>
  </div>
  <span class="kp-copied" role="status" aria-live="polite"></span>
</section>
